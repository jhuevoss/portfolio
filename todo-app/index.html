<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Joshua Huevos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #061E29, #1D546D);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      color: #F3F4F4;
    }

    .app {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 2rem 1.8rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .input-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    #taskInput {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #F3F4F4;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    #taskInput::placeholder {
      color: rgba(243,244,244,0.5);
    }

    #taskInput:focus {
      border-color: #5F9598;
    }

    #addBtn {
      background: #5F9598;
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s, transform 0.1s;
    }

    #addBtn:hover {
      background: #1D546D;
    }

    #addBtn:active {
      transform: scale(0.95);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    li {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      transition: background 0.2s;
    }

    li:hover {
      background: rgba(255,255,255,0.1);
    }

    li.completed span {
      text-decoration: line-through;
      opacity: 0.6;
    }

    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #5F9598;
      cursor: pointer;
      flex-shrink: 0;
    }

    li span {
      flex: 1;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(243,244,244,0.5);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover {
      color: #ff6b6b;
      background: rgba(255,107,107,0.15);
    }

    .empty-msg {
      text-align: center;
      opacity: 0.5;
      font-size: 0.9rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>📝 My To-Do List</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
      <button id="addBtn" aria-label="Add task">+</button>
    </div>

    <ul id="taskList"></ul>

    <p class="empty-msg" id="emptyMsg">No tasks yet. Add one above!</p>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const emptyMsg = document.getElementById('emptyMsg');

    let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];

    function saveTasks() {
      localStorage.setItem('myTasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');

        if (task.completed) li.classList.add('completed');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.addEventListener('change', () => toggleTask(index));

        const span = document.createElement('span');
        span.textContent = task.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '✕';
        delBtn.setAttribute('aria-label', 'Delete task');
        delBtn.addEventListener('click', () => deleteTask(index));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();

      if (text === '') return;

      tasks.push({ text: text, completed: false });
      taskInput.value = '';

      saveTasks();
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    addBtn.addEventListener('click', addTask);

    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    renderTasks();
  </script>
</body>
</html>
